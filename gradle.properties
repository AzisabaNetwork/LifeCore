# ---- Target platform ----------------------------------------------------------
# To move to another Minecraft version, change these values (and the api-version is
# derived from minecraftVersion automatically).
#
# Example for Paper 26.x:
#   minecraftVersion=26.1
#   paperDevBundle=26.1.build.XX-stable
#   javaVersion=25
minecraftVersion=1.21.11
paperDevBundle=1.21.11-R0.1-SNAPSHOT
javaVersion=21

# ---- Plugin -------------------------------------------------------------------
pluginVersion=7.1.1

# ---- Gradle -------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
kotlin.code.style=official
